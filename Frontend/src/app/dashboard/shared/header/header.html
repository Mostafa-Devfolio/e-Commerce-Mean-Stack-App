<header class="h-20 bg-white/70 backdrop-blur-xl border-b border-gray-100 sticky top-0 z-40 flex items-center justify-between px-6 sm:px-10 shadow-sm transition-all duration-300">
  
  <div class="flex items-center">
    <div class="relative hidden sm:block">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input type="text" placeholder="Search orders, users..." 
             class="pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary w-64 transition-all">
    </div>
  </div>

  <div class="flex items-center gap-6">
    
    <button class="relative p-2 text-gray-400 hover:text-primary transition-colors focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
      <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
    </button>

    <div class="flex items-center gap-3 pl-6 border-l border-gray-200">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-black text-gray-900">{{ authService.currentUser()?.name }}</p>
        <p class="text-[10px] font-bold text-primary uppercase tracking-wider">Administrator</p>
      </div>
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-blue-500 flex items-center justify-center text-white font-black shadow-lg">
        {{ authService.currentUser()?.name.charAt(0) }}
      </div>
    </div>
  </div>
</header>

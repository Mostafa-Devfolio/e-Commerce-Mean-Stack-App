<header
  class="bg-white/80 backdrop-blur-xl shadow-[0_4px_30px_rgb(0,0,0,0.03)] border-b border-gray-100/50 sticky top-0 z-50 transition-all duration-300"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <div class="flex-shrink-0 flex items-center cursor-pointer group" routerLink="/">
        <span
          class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-blue-600 tracking-tighter drop-shadow-sm group-hover:opacity-80 transition-opacity"
        >
          PRISM
        </span>
      </div>

      <nav class="hidden md:flex space-x-2">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="text-primary bg-primary/5 font-bold"
          class="text-gray-600 hover:text-primary hover:bg-gray-50 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300"
        >
          Home
        </a>
        <a
          routerLink="/explore"
          routerLinkActive="text-primary bg-primary/5 font-bold"
          class="text-gray-600 hover:text-primary hover:bg-gray-50 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300"
        >
          Explore
        </a>
        <a
          routerLink="/categories"
          routerLinkActive="text-primary bg-primary/5 font-bold"
          class="text-gray-600 hover:text-primary hover:bg-gray-50 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-300"
        >
          Categories
        </a>
      </nav>

      <div class="flex items-center space-x-3 sm:space-x-5">
        @if (authService.currentUser()) {
          <a
            routerLink="/cart"
            class="group relative p-2 text-gray-500 hover:text-primary transition-colors focus:outline-none"
          >
            <div
              class="absolute inset-0 bg-primary/10 rounded-full scale-0 group-hover:scale-100 transition-transform duration-300 origin-center"
            ></div>
            <svg
              class="w-6 h-6 relative z-10 group-hover:-translate-y-0.5 transition-transform duration-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
              ></path>
            </svg>
          </a>

          <div class="hidden sm:block w-px h-6 bg-gray-200"></div>
          <a
            routerLink="/orders"
            class="text-sm font-bold text-gray-600 hover:text-primary hidden sm:block transition-colors"
            >Orders</a
          >

          <div
            class="flex items-center space-x-3 pl-2 sm:pl-4 border-l border-gray-200 sm:border-none"
          >
            <div
              class="hidden sm:flex items-center gap-2 bg-gray-50 border border-gray-100 py-1.5 px-3 rounded-full"
            >
              <svg
                class="w-4 h-4 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
              <span class="text-sm font-bold text-gray-700 truncate max-w-[120px]">{{
                authService.currentUser()?.name
              }}</span>
            </div>

            <button
              (click)="logout()"
              class="text-sm font-bold text-red-500 hover:text-white hover:bg-red-500 border border-red-100 hover:border-red-500 px-4 py-2 rounded-xl transition-all duration-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500/20"
            >
              Logout
            </button>
          </div>
        } @else {
          <a
            routerLink="/login"
            class="text-sm font-bold text-gray-600 hover:text-primary transition-colors px-2"
            >Log in</a
          >

          <a
            routerLink="/signup"
            class="bg-gradient-to-r from-primary to-blue-600 text-white hover:from-blue-600 hover:to-primary px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 shadow-[0_4px_15px_-3px_rgba(37,99,235,0.4)] hover:shadow-[0_8px_20px_-3px_rgba(37,99,235,0.5)] transform hover:-translate-y-0.5"
          >
            Sign up
          </a>
        }
      </div>
    </div>
  </div>
</header>
